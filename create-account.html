<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Management Account | Baron Corporation</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="nav-brand" href="index.html"><img src="baron-logo-cropped.png" alt="Baron Corporation"></a></div></header><main><div class="container auth-shell"><div class="auth-card"><span class="eyebrow" style="color:var(--blue)">ACCOUNT SETUP</span><h1>Create account</h1><p>The management dashboard only grants access when signed in as the authorized management email.</p><form id="createAccountForm"><div class="form-field"><label>Name</label><input class="input" name="full_name" required></div><div class="form-field" style="margin-top:14px"><label>Email</label><input class="input" type="email" name="email" required></div><div class="form-field" style="margin-top:14px"><label>Password</label><input class="input" type="password" name="password" required></div><div class="form-field" style="margin-top:14px"><label>Confirm password</label><input class="input" type="password" name="confirm_password" required></div><button class="btn btn-dark btn-full" type="submit" style="margin-top:18px">Create Account</button><div class="form-success" hidden></div><div class="form-error" hidden></div></form></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></body></html>
